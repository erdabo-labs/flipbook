services:
  flipbook:
    build: .
    platform: linux/arm64
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
    # Bind only to the VM interface explicitly selected by the operator.
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks:
      - apps-database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

networks:
  apps-database:
    external: true
    name: apps-database
